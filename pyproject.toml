[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "slipcam"
dynamic = ["version"]
description = "Surface fault slip from video, with framecor: dense correlation of video frames on the GPU (CUDA) or the CPU (FFTW, OpenMP)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
slipcam-decode = "slipcam.decode_frames:main"
slipcam-track = "slipcam.track_offsets:main"
slipcam-map = "slipcam.offset_map:main"
slipcam-regions = "slipcam.region_series:main"
slipcam-slip = "slipcam.slip_series:main"
slipcam-auto = "slipcam.auto_slip:main"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["python/slipcam"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "CMakeLists.txt"
metadata.version.regex = 'project\(slipcam VERSION (?P<value>[0-9.]+)'

# build options, e.g., pip install . -Ccmake.define.FRAMECOR_CUDA=OFF
[tool.scikit-build.cmake.define]
FRAMECOR_CUDA = "AUTO"

[tool.pytest.ini_options]
testpaths = ["tests"]
